# ==================== APPLICATION ====================
spring.application.name=${APP_NAME}
server.port=${SERVER_PORT}
server.servlet.context-path=${CONTEXT_PATH}

# ==================== DATABASE ====================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# ==================== JPA/HIBERNATE ====================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}
spring.jpa.show-sql=${SHOW_SQL}
spring.jpa.database-platform=${HIBERNATE_DIALECT}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50

# ==================== SECURITY ====================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION}

# ==================== EMAIL ====================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST}
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false

# ==================== SMS ====================
sms.enabled=${SMS_ENABLED}
sms.provider.url=${SMS_PROVIDER_URL}
sms.auth.key=${SMS_AUTH_KEY}
sms.sender.id=${SMS_SENDER_ID}

# ==================== RAZORPAY ====================
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# ==================== SWAGGER ====================
springdoc.api-docs.path=${SWAGGER_API_DOCS}
springdoc.swagger-ui.path=${SWAGGER_UI}
springdoc.swagger-ui.operationsSorter=method

# ==================== FLYWAY ====================
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ==================== LOGGING ====================
logging.level.com.yavijexpress=DEBUG
logging.level.org.springframework.security=INFO
logging.file.name=${LOG_FILE}

# ==================== FRONTEND_URL ====================
frontend_url=${FRONTEND_URL}